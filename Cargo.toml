[package]
name = "cosmic-applet-ollama"
version = "0.1.0"
edition = "2021"
authors = ["ashrafpy"]
description = "COSMIC panel applet displaying local Ollama inference model info, token telemetry, and controls"
readme = "README.md"
homepage = "https://github.com/ashrafpy/ollama-cosmic"
repository = "https://github.com/ashrafpy/ollama-cosmic"
license = "MIT"
keywords = ["cosmic", "applet", "ollama", "llm", "wayland"]
categories = ["gui"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "process", "macros", "sync", "io-util", "fs"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "tokio", "wayland"]
